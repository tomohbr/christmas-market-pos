<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <defs>
    <radialGradient id="ornShine" cx="35%" cy="35%" r="60%">
      <stop offset="0%" stop-color="white" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="192" height="192" rx="24" fill="#1a3d1f"/>

  <!-- Snow ground -->
  <ellipse cx="96" cy="164" rx="52" ry="10" fill="#e8f4f8" opacity="0.9"/>

  <!-- Tree trunk -->
  <rect x="87" y="148" width="18" height="20" rx="3" fill="#6b3d11"/>

  <!-- Tree layers (bottom to top) -->
  <!-- Layer 3 - bottom -->
  <polygon points="96,88 54,148 138,148" fill="#2d6a4f"/>
  <polygon points="96,88 54,148 138,148" fill="#40916c" opacity="0.4"/>

  <!-- Layer 2 - middle -->
  <polygon points="96,56 62,112 130,112" fill="#2d6a4f"/>
  <polygon points="96,56 62,112 130,112" fill="#52b788" opacity="0.3"/>

  <!-- Layer 1 - top -->
  <polygon points="96,28 70,80 122,80" fill="#2d6a4f"/>
  <polygon points="96,28 70,80 122,80" fill="#74c69d" opacity="0.3"/>

  <!-- Tree outline/shadow for depth -->
  <polygon points="96,88 54,148 138,148" fill="none" stroke="#1a4d2e" stroke-width="1.5"/>
  <polygon points="96,56 62,112 130,112" fill="none" stroke="#1a4d2e" stroke-width="1.5"/>
  <polygon points="96,28 70,80 122,80" fill="none" stroke="#1a4d2e" stroke-width="1.5"/>

  <!-- Ornaments - red balls -->
  <circle cx="78" cy="100" r="6" fill="#c1121f"/>
  <circle cx="78" cy="100" r="6" fill="url(#ornShine)" opacity="0.5"/>
  <circle cx="114" cy="108" r="6" fill="#c1121f"/>
  <circle cx="114" cy="108" r="6" fill="url(#ornShine)" opacity="0.5"/>
  <circle cx="80" cy="130" r="7" fill="#e63946"/>
  <circle cx="112" cy="136" r="6" fill="#c1121f"/>
  <circle cx="96" cy="140" r="5" fill="#e63946"/>

  <!-- Ornaments - gold balls -->
  <circle cx="96" cy="96" r="5" fill="#f4a261"/>
  <circle cx="68" cy="124" r="5" fill="#e9c46a"/>
  <circle cx="124" cy="120" r="5" fill="#f4a261"/>
  <circle cx="88" cy="66" r="4" fill="#e9c46a"/>
  <circle cx="108" cy="68" r="4" fill="#f4a261"/>

  <!-- Ornament shine highlights -->
  <circle cx="79" cy="98" r="2" fill="white" opacity="0.6"/>
  <circle cx="115" cy="106" r="2" fill="white" opacity="0.6"/>
  <circle cx="81" cy="128" r="2.5" fill="white" opacity="0.6"/>

  <!-- Star on top -->
  <polygon points="96,14 98.9,22.4 107.8,22.4 100.7,27.6 103.5,36 96,30.9 88.5,36 91.3,27.6 84.2,22.4 93.1,22.4"
           fill="#f4d03f" stroke="#e6b800" stroke-width="0.5"/>

  <!-- Lights string glow -->
  <circle cx="72" cy="96" r="3" fill="#ffd700" opacity="0.8"/>
  <circle cx="120" cy="104" r="3" fill="#ff6b6b" opacity="0.8"/>
  <circle cx="62" cy="132" r="3" fill="#ffd700" opacity="0.8"/>
  <circle cx="130" cy="128" r="3" fill="#ff6b6b" opacity="0.8"/>
  <circle cx="96" cy="72" r="2.5" fill="#ffd700" opacity="0.8"/>

  <!-- Snow dots on tree -->
  <circle cx="76" cy="148" r="3" fill="white" opacity="0.7"/>
  <circle cx="116" cy="148" r="3" fill="white" opacity="0.7"/>
  <circle cx="96" cy="112" r="2.5" fill="white" opacity="0.6"/>

  <!-- Snowflakes in background -->
  <g fill="white" opacity="0.4">
    <circle cx="30" cy="40" r="2"/>
    <circle cx="160" cy="55" r="1.5"/>
    <circle cx="20" cy="80" r="1.5"/>
    <circle cx="170" cy="30" r="2"/>
    <circle cx="155" cy="170" r="1.5"/>
    <circle cx="25" cy="155" r="2"/>
    <circle cx="40" cy="170" r="1.5"/>
    <circle cx="168" cy="145" r="1.5"/>
  </g>

</svg>
