<!DOCTYPE html>
<html>
<head><title>POS Admin Setup</title></head>
<body>
<h1>POS 管理者セットアップ</h1>
<div id="log" style="white-space:pre-wrap; font-family:monospace; background:#f0f0f0; padding:16px; border-radius:8px;"></div>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.8.1/firebase-app.js'
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/11.8.1/firebase-auth.js'
import { getFirestore, doc, setDoc } from 'https://www.gstatic.com/firebasejs/11.8.1/firebase-firestore.js'

const app = initializeApp({
  apiKey: 'AIzaSyD8HwqaLLcb0TMEC0fRujOwoqXodll58iw',
  authDomain: 'my-pos-app-6a0eb.firebaseapp.com',
  projectId: 'my-pos-app-6a0eb',
})

const auth = getAuth(app)
const db = getFirestore(app)
const logEl = document.getElementById('log')
function log(msg) { logEl.textContent += msg + '\n' }

const EVENT_ID = 'breakfast-event-2026'
const users = [
  { email: 'admin@pos.local', password: 'admin1234', displayName: '管理者', role: 'admin' },
  { email: 'cashier@pos.local', password: 'cashier1234', displayName: 'レジ担当', role: 'cashier' },
  { email: 'kitchen@pos.local', password: 'kitchen1234', displayName: '厨房担当', role: 'kitchen' },
  { email: 'handover@pos.local', password: 'handover1234', displayName: '受渡し担当', role: 'handover' },
]

for (const u of users) {
  try {
    let cred
    try {
      cred = await createUserWithEmailAndPassword(auth, u.email, u.password)
      log(`作成: ${u.email} (${cred.user.uid})`)
    } catch (e) {
      if (e.code === 'auth/email-already-in-use') {
        cred = await signInWithEmailAndPassword(auth, u.email, u.password)
        log(`既存: ${u.email} (${cred.user.uid})`)
      } else {
        throw e
      }
    }
    await setDoc(doc(db, 'users', cred.user.uid), {
      displayName: u.displayName,
      role: u.role,
      eventId: EVENT_ID,
    }, { merge: true })
    log(`  → Firestoreプロフィール設定完了 (role: ${u.role})`)
  } catch (e) {
    log(`エラー (${u.email}): ${e.message}`)
  }
}

log('\n=== 完了 ===')
log('管理者: admin@pos.local / admin1234')
log('レジ: cashier@pos.local / cashier1234')
log('厨房: kitchen@pos.local / kitchen1234')
log('受渡し: handover@pos.local / handover1234')
log(`イベントID: ${EVENT_ID}`)
</script>
</body>
</html>
